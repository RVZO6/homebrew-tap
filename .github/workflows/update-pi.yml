name: Update Pi

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Casks/pi.rb
      - scripts/**
      - tests/**
      - .github/workflows/update-pi.yml

concurrency:
  group: update-pi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Test updater
        run: python3 -m unittest discover -s tests -v

      - name: Check upstream release
        id: release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-pi.py

      - name: Commit verified release
        if: steps.release.outputs.updated == 'true'
        env:
          PI_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks/pi.rb
          git commit -m "Update Pi to $PI_VERSION"
          git push origin HEAD:main
